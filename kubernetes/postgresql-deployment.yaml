apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8-postgresql
  labels:
    app: postgresql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
    spec:
      containers:
      - name: postgresql
        image: postgres:16
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: k8-secret
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: k8-secret
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: k8-secret
              key: POSTGRES_DB 
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata         
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: postgresql
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: postgresql
        persistentVolumeClaim:
          claimName: k8-claim